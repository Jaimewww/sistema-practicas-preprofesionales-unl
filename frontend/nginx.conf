# nginx para el bundle de Angular: SPA con rutas del lado del cliente.
#
# `try_files` devuelve index.html en cualquier ruta desconocida para que
# /login, /reportes/nuevo y el resto funcionen al recargar el navegador.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian: cache larga.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index no se cachea: es lo que apunta a los bundles con hash nuevo.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
