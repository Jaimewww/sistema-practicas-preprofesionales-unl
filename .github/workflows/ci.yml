name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.8.6
      - run: ruff check backend --output-format github

  security:
    name: Security scan (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.8.0 pip-audit==2.7.3
      # Static analysis of application code (OWASP-style issues); tests are excluded.
      - run: bandit -r backend -x "*/tests*.py,*/tests/*"
      # Known vulnerabilities (CVE/PYSEC) in the pinned dependency set.
      - run: pip-audit -r backend/requirements-dev.txt

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: practicas
          POSTGRES_USER: practicas
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicas -d practicas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values: these are not secrets and are never used outside the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: practicas
      POSTGRES_USER: practicas
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # pytest-django runs the whole suite (#80); .coveragerc scopes coverage to
      # apps/ and config/, and coverage.xml is what SonarCloud reads.
      - run: python -m pytest --cov --cov-report=xml:coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  sonarcloud:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    needs: test
    # Needs the SONAR_TOKEN repository secret (docs/portal/calidad-sonarcloud.qmd).
    # Without it (not configured yet, or a PR from a fork) the analysis is skipped
    # and the job stays green, so CI never breaks for a missing secret.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0  # full history: SonarCloud uses blame to tell new code from old
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: backend
      - uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: https://sonarcloud.io
      - if: env.SONAR_TOKEN == ''
        run: 'echo "::notice::SonarCloud skipped - SONAR_TOKEN is not configured, see docs/portal/calidad-sonarcloud.qmd"'

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag practicas-backend:ci .
