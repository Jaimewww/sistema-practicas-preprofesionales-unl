name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.8.6
      - run: ruff check backend --output-format github

  security:
    name: Security scan (bandit, pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.8.0 pip-audit==2.7.3
      # Static analysis of application code (OWASP-style issues); tests are excluded.
      - run: bandit -r backend -x "*/tests*.py,*/tests/*"
      # Known vulnerabilities (CVE/PYSEC) in the pinned dependency set.
      - run: pip-audit -r backend/requirements-dev.txt

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: practicas
          POSTGRES_USER: practicas
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U practicas -d practicas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # CI-only values: these are not secrets and are never used outside the job.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: practicas
      POSTGRES_USER: practicas
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt coverage
      # Switch to `pytest --cov` once the suite moves to pytest-django (#80).
      - run: coverage run --source=apps,config manage.py test
      - run: coverage report --skip-empty
      - run: coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag practicas-backend:ci .
