# SonarQube Cloud (SonarCloud) analysis, run from CI (.github/workflows/ci.yml, job "sonarcloud").
# Setup steps: docs/portal/calidad-sonarcloud.qmd and ADR 0016.
sonar.organization=jaimewww
sonar.projectKey=Jaimewww_sistema-practicas-preprofesionales-unl
sonar.projectName=Sistema de prácticas preprofesionales UNL

# What is analysed: the Django backend. Tests are a separate group so they do not
# count as production code (duplication, smells) and are not measured for coverage.
sonar.sources=backend
sonar.tests=backend
sonar.test.inclusions=backend/**/tests.py,backend/**/tests_*.py,backend/**/tests/**
sonar.exclusions=backend/**/migrations/**,backend/static/**,backend/templates/**
sonar.python.version=3.13

# Coverage produced by the "test" job (coverage xml), downloaded as an artifact.
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.sourceEncoding=UTF-8
