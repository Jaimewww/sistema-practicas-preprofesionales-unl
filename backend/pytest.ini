[pytest]
# Runner de pruebas del backend (#80). El comando canónico se corre SIEMPRE
# desde backend/ (ver README): `python -m pytest`.
#
# OJO: DJANGO_SETTINGS_MODULE NO se declara acá. pytest-django carga settings en
# `pytest_load_initial_conftests`, ANTES de importar este backend/conftest.py; con
# la variable en el ini, un proceso sin DJANGO_SECRET_KEY moriría con
# ImproperlyConfigured (settings.py falla cerrada, contrato S4) sin que conftest
# pudiera generar la clave efímera. Por eso conftest.py exporta
# DJANGO_SETTINGS_MODULE=config.settings y la clave efímera antes del setup, y si
# el entorno/CI ya trae ambos valores, los respeta (setdefault).
#
# No escanear el árbol buscando manage.py: ya estamos en backend/.
django_find_project = false

# Descubrimiento equivalente al DiscoverRunner retenido (`manage.py test`): el
# patrón de Django es `test*.py` (también matchea `apps/prototipo/tests.py` y
# `config/tests.py`) y descubre TODO el proyecto, no solo backend/tests/. Medido:
# tests/ 259 + apps/prototipo 195 + apps/health 2 + config 3 = 459, el mismo total
# del runner retenido. Recortar a `test_*.py` + `testpaths = tests` dejaría 200
# pruebas fuera de pytest y las dos corridas ya no describirían la misma suite.
python_files = test*.py
testpaths = tests apps config

# -ra: resumen corto de skips/xfails al final; así el skip PG-only se ve.
# --strict-markers: un marcador no registrado es error (nunca se ignora en
# silencio); los cuatro marcadores de abajo son los únicos válidos y conftest.py
# los asigna por ruta de módulo.
addopts = -ra --strict-markers

# Clasificación de la suite (#80, S2). El mapeo ruta -> marcador vive en
# backend/conftest.py (docstring) porque la suite existente es unittest.TestCase
# y no se reescribe: cero decoradores por prueba.
markers =
    unit: prueba unitaria de app o servicio, sin HTTP (tests/unit/*)
    integration: prueba de integración entre apps (tests/integration/*)
    api: superficie HTTP de la API v1 (envelope, reportes, asignación)
    security: autenticación/autorización y manejo de secretos

# Ruido acotado sin esconder fallos: el resumen de warnings sigue saliendo. La
# única advertencia que hoy ensucia la salida es interna de drf-spectacular 0.28
# bajo Python 3.14 (`_UnionGenericAlias` deprecado); se filtra por módulo y
# mensaje exactos, no por categoría global.
filterwarnings =
    default
    ignore:'_UnionGenericAlias' is deprecated and slated for removal in Python 3.17:DeprecationWarning:drf_spectacular.*

# Cobertura (#80, S3): `python -m pytest --cov` cubre las apps del backend y
# muestra las líneas faltantes. Sin umbral: el gate lo decide CI (#82).
# pytest-cov: el flag --cov sin valor anula 'source'
# (pytest-cov plugin.py: --cov bare => cov_source=None). El comando documentado
# SIEMPRE usa --cov=apps; el umbral/estricto lo define CI (#82).
[coverage:run]
source = apps

[coverage:report]
show_missing = True
